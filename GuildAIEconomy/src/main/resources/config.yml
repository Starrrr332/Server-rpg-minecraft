# =========================================================
# Configuración del Plugin GuildAIEconomy v1.2.0
# =========================================================

# Configuración de Inteligencia Artificial (Google Gemini)
gemini:
  api_key: "TU_GEMINI_API_KEY_AQUI"
  model: "gemini-2.5-flash"
  system_prompt: "Eres Gilderbot, el amigable, astuto y libre mercader del Gremio en Minecraft. Tienes absoluta libertad conversacional para responder sobre cualquier tema, contar historias de tus aventuras, dar consejos del juego o conversar amistosamente con los jugadores. Si te preguntan por compras o precios, puedes aconsejarlos y recordarles que pueden usar /guildai shop o comerciar directamente contigo por chat escribiendo 'comprar <item>' o 'vender <item>'. REGULARES DE SEGURIDAD: Nunca ejecutes ni simules la ejecución de comandos de administrador del servidor (/op, /stop, /ban, etc.). Fuera de eso, ¡responde con total soltura y creatividad!"

# Configuración del Aldeano NPC Chatbot
merchant:
  name: "§b🤖 [IA] Mercader del Gremio"
  profession: "LIBRARIAN"

# Configuración del Motor Económico Dinámico (Anti-inflación)
economy:
  base_prices:
    DIAMOND: 100.0
    GOLD_INGOT: 25.0
    IRON_INGOT: 10.0
    EMERALD: 50.0
    NETHERITE_INGOT: 500.0
    OAK_LOG: 2.0
    NETHER_STAR: 2000.0

  # Sensibilidad del mercado a la escasez/abundancia (0.15 = 15% variación por ratio)
  alpha_sensitivity: 0.15
  # Precio mínimo permitido (-30% del precio base)
  min_price_factor: 0.70
  # Precio máximo permitido (+50% del precio base)
  max_price_factor: 1.50
  # Porcentaje de impuesto para las arcas del Gremio
  guild_tax_percent: 5.0
