name: '&2Tu Primera Clase de Combate'
questLore:
- Habla con los instructores del Gremio y elige tu primera clase RPG para desbloquear
  habilidades marciales.
temporaryPermissions: []
questAcceptDialog:
- '&8[&aCasus&8]&f Now that you know the guild, it is time to earn your first class.'
- Find Rowan with the Adventurer Instructor title beside Charles. His trial costs
  one coin.
- Once you have unlocked Adventurer, come back for your equipment.
questCompleteMessage:
- '&8[&aCasus&8]&f Welcome to the Adventurers! Here is your armor and a weapon of
  every type.'
- Try them all. Adventurers are proficient with every weapon!
- 'Talk to me again for two new journeys: the Story Mode dungeons and the Primis expedition.'
questCompleteCommands: []
turnInNPC: guide_1.yml
questLevel: 1
