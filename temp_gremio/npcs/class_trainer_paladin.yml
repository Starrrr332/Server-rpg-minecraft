greetings:
- Mantente firme como una muralla de piedra.\nOtros sobrevivirán al abrigo de tu escudo.
- Que la luz sagrada bendiga tus pasos, paladín.
- La disciplina y el deber son nuestro mayor estandarte.
dialog:
- Inspecciona tu progreso marcial\ny especializaciones con /em class.
- 'GESTIÓN DE AMENAZA (AGGRO): Como tanque principal,\ntu deber es golpear primero
  y usar Provocación.\n¡Mantén la furia del jefe centrada en ti!'
- 'ESCUDO Y POSICIONAMIENTO: Nunca des la espalda\nal jefe de mazmorra. Bloquear en
  el instante exacto\nreduce el retroceso y absorbe el impacto letal.'
- 'REGENERACIÓN SAGRADA: La energía de paladín\nse recupera más rápido mientras te
  mantengas\nen combate cuerpo a cuerpo contra el jefe.'
- 'PROTECCIÓN DE ALIADOS: Si un mago o cazador\natrae la amenaza por exceso de daño,
  interponte\ninmediatamente y aplica tu habilidad insignia.'
- 'AVISO DE BARRERAS: Cuando un jefe invoque una cúpula\no barrera defensiva, no desgastes
  tu energía;\nespera a que la cúpula caiga para asestar el golpe de gracia.'
farewell:
- Mantén tu juramento inquebrantable.
- Que tu escudo nunca caiga en batalla.
- Camina con honor bajo la luz.
