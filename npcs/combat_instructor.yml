greetings:
- ¿Quieres dominar las tácticas avanzadas de combate?
- ¿Listo para entender cómo vencer a los jefes más brutales?
- Un buen guerrero entrena su cuerpo; un maestro entrena su mente.
- Bienvenido al patio de armas. Escucha atentamente mis consejos.
dialog:
- El daño infligido genera amenaza.\nLos jefes perseguirán con furia a quien\nacumule
  mayor nivel de amenaza.
- Las provocaciones obligan al jefe\na centrar sus ataques en el tanque\ndurante unos
  instantes cruciales.
- Dale a tu tanque unos segundos\npara provocar y reunir a los monstruos\nantes de
  abrir fuego a discreción.
- El suelo teñido de rojo es una advertencia.\n¡Aléjate de inmediato antes\nde que
  caiga el ataque devastador!
- Tu nivel marcial y tu maestría de arma son vitales.\nEntrena con las armas que más\nutilices
  en batalla.
- Las armas propias de tu clase infligen\nun 10% más de daño adicional.\nConsulta
  tu menú de clase con /em class.
- 'Pulsa F dos veces para esquivar con destreza.\nF + clic izquierdo: Habilidad Insignia.\nF
  + clic derecho: Habilidad de Utilidad.'
- Tu vida y energía de clase aparecen\njusto sobre tu barra de objetos.\nVigila ambas
  atentamente en combate.
- El Maná se regenera con el tiempo.\nLos Berserkers acumulan Furia de batalla\nasestando
  y recibiendo ataques.
- Los Paladines se recuperan más rápido\ncerca de los jefes; los Clérigos\ncerca de
  sus aliados heridos.
- Los Montaraces recuperan Concentración\nmás rápido tras 5 segundos\nsin recibir
  daño alguno.
- Los proyectiles de varita buscan prioritariamente\na los jefes, pero muros y obstáculos\npueden
  interceptar sus disparos.
- Las bolas de fuego de bastón estallan al impactar.\nApúntalas al centro de grupos\nde
  enemigos agrupados.
- Lleva abundantes provisiones a las mazmorras.\nComer toma tiempo; busca siempre\nun
  respiro seguro en la batalla.
- Repara todo tu equipo dañado antes\nde adentrarte en una mazmorra.\nVisita siempre
  al maestro armero.
- Los jefes de élite poseen mecánicas telegrafiadas.\nCuando veas avisos en el chat
  o partículas concentradas,\n¡reacciona de inmediato según el aviso!
