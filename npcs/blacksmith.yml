greetings:
- ¡Bienvenido a mi tienda, noble aventurero!
- ¡Aquí compro tus botines por las mejores monedas!
- ¡Mercancía selecta, recién forjada!
- ¿Tienes tesoros o armas para tasar?
- ¿Buscas equipamiento de élite para tu aventura?
- ¡Siempre la mejor calidad garantizada!
dialog:
- ¡Los monstruos de mayor nivel\nsueltan objetos de mucho más valor!
- ¡Las armas y armaduras con más\nencantamientos valen muchas más monedas!
- ¡Cuanto más fuerte sea el jefe,\nmejores serán las armas que obtengas!
- ¡Las criaturas de mayor nivel tienen\nmayor probabilidad de soltar botín épico!
- Los monstruos de élite se sienten atraídos\npor armaduras poderosas. ¡Cuanto mejor
  equipo\nlleves, más alto será el nivel de tus rivales!
- ¡Ciertas armas y armaduras poseen\nefectos de poción continuos especiales!
- ¡Los objetos legendarios esconden\nhabilidades pasivas únicas!
- ¡El encantamiento Cazador atrae\nmonstruos de élite hacia tu posición!
- ¡Las armas y armaduras de élite que\nconsigas puedes venderlas aquí por oro!
- ¡Alcanzar rangos más altos en el Gremio\nmejora la calidad del botín que obtienes!
farewell:
- Thank you for your business!
- Come back soon!
- Come back any time!
- Recommend this shop to your\nfriends!
